<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2E9E4">
<title>小日常</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #F2E9E4;
  --card: #FFFFFF;
  --primary: #C9A9A6;
  --primary-dark: #B08985;
  --accent: #DDB892;
  --text: #4A3F3B;
  --text-light: #8D7B75;
  --border: #E8DDD6;
  --danger: #D4A0A0;
  --success: #8BB89B;
  --shadow: 0 2px 12px rgba(74, 63, 59, 0.06);
  --radius: 16px;
  --radius-sm: 10px;
  --font: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  /* exercise colors */
  --ex-swim: #4A90D9;
  --ex-pamela: #E86A9E;
  --ex-leg: #8E6AD9;
  --ex-belly: #E8A23D;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  max-width: 480px; margin: 0 auto;
  position: relative;
}
header {
  padding: 44px 20px 12px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg);
  position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
header .date { font-size: 13px; color: var(--text-light); }
main {
  flex: 1; overflow-y: auto; padding: 0 16px 100px 16px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
main::-webkit-scrollbar { display: none; }

/* Bottom Nav */
nav.tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; padding: 6px 8px env(safe-area-inset-bottom, 6px) 8px;
  z-index: 100;
}
nav.tabs button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; cursor: pointer;
  font-size: 10px; color: var(--text-light); padding: 6px 0;
  border-radius: 12px; transition: all 0.2s;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
}
nav.tabs button.active { color: var(--primary-dark); }
nav.tabs button .icon { font-size: 21px; line-height: 1; }
nav.tabs button.active .icon { transform: scale(1.1); }

/* Module Section */
.module { display: none; }
.module.active { display: block; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Cards */
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 18px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-header h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card-header h3 .emoji { font-size: 18px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 16px; border-radius: 20px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: var(--font);
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: var(--primary-dark); transform: scale(0.97); }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 14px; }
.btn-outline { background: none; border: 1.5px solid var(--primary); color: var(--primary-dark); }
.btn-outline:active { background: var(--primary); color: #fff; }
.btn-danger { background: none; border: none; color: var(--danger); font-size: 12px; padding: 4px 8px; }

/* Forms */
input, select {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: 14px;
  font-family: var(--font); color: var(--text);
  background: var(--bg); transition: border-color 0.2s;
  -webkit-appearance: none;
}
input:focus, select:focus { outline: none; border-color: var(--primary); }
input::placeholder { color: #C4B8B0; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; }
.form-row > * { flex: 1; }

/* List items */
.list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  gap: 10px;
}
.list-item:last-child { border-bottom: none; }
.list-item .info { flex: 1; min-width: 0; }
.list-item .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .meta { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.list-item .amount { font-weight: 700; font-size: 15px; white-space: nowrap; }
.list-item .amount.income { color: var(--success); }
.list-item .amount.expense { color: var(--danger); }

/* Summary cards */
.summary-row { display: flex; gap: 10px; margin-bottom: 12px; }
.summary-card {
  flex: 1; background: var(--card); border-radius: var(--radius);
  padding: 14px; text-align: center; box-shadow: var(--shadow);
}
.summary-card .label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.summary-card .value { font-size: 20px; font-weight: 700; }
.summary-card .value.income-v { color: var(--success); }
.summary-card .value.expense-v { color: var(--danger); }
.summary-card .value.balance-v { color: var(--primary-dark); }

/* Habit / Daily */
.habit-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.habit-row:last-child { border-bottom: none; }
.habit-check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--border); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.2s; flex-shrink: 0;
}
.habit-check.done { background: var(--success); border-color: var(--success); color: #fff; }
.habit-row .habit-name { flex: 1; font-size: 14px; }
.habit-row .habit-name.done-text { text-decoration: line-through; color: var(--text-light); }
.habit-streak { font-size: 11px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.ex-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

/* Todo */
.todo-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all 0.2s; flex-shrink: 0;
}
.todo-check.done { background: var(--success); border-color: var(--success); color: #fff; }
.todo-text { font-size: 14px; }
.todo-text.done-text { text-decoration: line-through; color: var(--text-light); }

/* Calendar (fitness) */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-header .month-label { font-size: 16px; font-weight: 700; }
.cal-header button { background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px 10px; color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-grid .day-name { font-size: 11px; color: var(--text-light); padding: 6px 0; font-weight: 600; }
.cal-grid .day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 13px; cursor: pointer;
  transition: all 0.15s; position: relative;
}
.cal-grid .day.other { color: #D0C8C2; }
.cal-grid .day.today { background: var(--primary); color: #fff; font-weight: 700; }
.cal-grid .day:active { transform: scale(0.9); }
.cal-dots {
  position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; max-width: 90%;
}
.cal-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
.cal-dot.plus { background: #C4B8B0; }

/* Fitness legend */
.fitness-legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.fitness-legend span { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-light); }
.fitness-legend .ex-dot { width: 10px; height: 10px; }

/* Weight Chart */
.chart-container { height: 180px; margin-bottom: 12px; position: relative; }
.chart-container.mini { height: 90px; margin-bottom: 0; }

/* Empty state */
.empty { text-align: center; padding: 30px 0; color: var(--text-light); font-size: 13px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3);
  z-index: 200; display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-sheet {
  background: var(--card); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px; padding: 20px 16px 30px;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-sheet h3 { font-size: 16px; margin-bottom: 16px; text-align: center; }
.modal-sheet .form-row { margin-bottom: 10px; }
.modal-sheet .btn { width: 100%; justify-content: center; margin-top: 8px; padding: 12px; }

/* FAB */
.fab {
  position: fixed; bottom: 110px; right: calc(50% - 200px);
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--primary); color: #fff; border: none;
  font-size: 24px; cursor: pointer; box-shadow: 0 4px 16px rgba(201, 169, 166, 0.4);
  z-index: 99; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.fab:active { transform: scale(0.93); }
@media (max-width: 480px) { .fab { right: 16px; } }

/* Quick action row */
.quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.quick-action {
  padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--primary);
  background: none; color: var(--primary-dark); font-size: 12px;
  cursor: pointer; font-family: var(--font); transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.quick-action:active { background: var(--primary); color: #fff; }

/* Progress bar */
.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--success); border-radius: 3px; transition: width 0.4s; }

/* Overview board */
.ov-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ov-chip {
  background: var(--card); border-radius: 14px; padding: 12px 6px;
  text-align: center; box-shadow: var(--shadow); cursor: pointer;
  transition: all 0.2s;
}
.ov-chip:active { transform: scale(0.95); }
.ov-chip .ex-dot { width: 10px; height: 10px; margin: 0 auto 6px; display: block; }
.ov-chip .days { font-size: 18px; font-weight: 700; line-height: 1.2; }
.ov-chip .label { font-size: 10px; color: var(--text-light); margin-top: 2px; }
.ov-chip .sub { font-size: 10px; color: var(--accent); font-weight: 600; }
.ov-weight-card { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.ov-weight-left { text-align: center; }
.ov-weight-left .big { font-size: 26px; font-weight: 700; color: var(--primary-dark); }
.ov-weight-left .small { font-size: 12px; color: var(--text-light); }
.ov-delta { font-size: 13px; font-weight: 600; }
.ov-delta.down { color: var(--success); }
.ov-delta.up { color: var(--danger); }

/* Toast */
.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 20px;
  border-radius: 20px; font-size: 13px; z-index: 300;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🌷 小日常</h1>
    <div class="date" id="headerDate"></div>
  </div>
  <div id="headerEmoji" style="font-size:28px;"></div>
</header>

<main id="mainContent"></main>

<button class="fab" id="fabBtn" title="添加">+</button>

<nav class="tabs" id="tabNav">
  <button data-tab="overview"><span class="icon">🏠</span>总览</button>
  <button data-tab="money"><span class="icon">💰</span>记账</button>
  <button data-tab="weight"><span class="icon">⚖️</span>体重</button>
  <button data-tab="habits"><span class="icon">✅</span>日常</button>
  <button data-tab="fitness"><span class="icon">🏊</span>健身</button>
  <button data-tab="todos"><span class="icon">📝</span>待办</button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ DATA STORE ============
const STORE = {
  _key(k) { return 'gd_' + k; },
  get(k, def) { try { const v = localStorage.getItem(this._key(k)); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(k, v) { localStorage.setItem(this._key(k), JSON.stringify(v)); }
};

// ============ PRESET SEED (体重历史数据,仅首次填充) ============
(function seedPreset() {
  try {
    if (localStorage.getItem('gd_weight') !== null) return;
    const preset = [
      {id:'seed-01', weight:152,  date:'2026-06-26'},
      {id:'seed-02', weight:147,  date:'2026-07-06'},
      {id:'seed-03', weight:144,  date:'2026-07-07'},
      {id:'seed-04', weight:142.8,date:'2026-07-08'},
      {id:'seed-05', weight:145.2,date:'2026-07-10'},
      {id:'seed-06', weight:145.2,date:'2026-07-12'},
      {id:'seed-07', weight:144.6,date:'2026-07-13'},
      {id:'seed-08', weight:144.4,date:'2026-07-14'},
      {id:'seed-09', weight:143.4,date:'2026-07-15'},
      {id:'seed-10', weight:144,  date:'2026-07-16'},
      {id:'seed-11', weight:143.6,date:'2026-07-17'},
      {id:'seed-12', weight:145,  date:'2026-07-18'},
      {id:'seed-13', weight:144.6,date:'2026-07-19'},
      {id:'seed-14', weight:143.6,date:'2026-07-20'},
      {id:'seed-15', weight:143.2,date:'2026-07-21'},
      {id:'seed-16', weight:142,  date:'2026-07-22'},
      {id:'seed-17', weight:141.4,date:'2026-07-23'},
      {id:'seed-18', weight:141.6,date:'2026-07-24'},
      {id:'seed-19', weight:142,  date:'2026-07-25'},
      {id:'seed-20', weight:141,  date:'2026-07-26'},
      {id:'seed-21', weight:140,  date:'2026-07-27'},
      {id:'seed-22', weight:140.4,date:'2026-07-28'},
      {id:'seed-23', weight:139.2,date:'2026-07-29'},
      {id:'seed-24', weight:139.2,date:'2026-07-30'},
      {id:'seed-25', weight:139.4,date:'2026-07-31'},
      {id:'seed-26', weight:139.2,date:'2026-08-01'}
    ];
    STORE.set('weight', preset);
  } catch(e) {}
})();

// ============ EXERCISE DEFINITIONS ============
const EXERCISES = [
  { id:'swim',   name:'游泳',   icon:'🏊', color:'var(--ex-swim)' },
  { id:'pamela', name:'帕梅拉', icon:'💃', color:'var(--ex-pamela)' },
  { id:'leg',    name:'瘦腿',   icon:'🦵', color:'var(--ex-leg)' },
  { id:'belly',  name:'瘦肚子', icon:'🔥', color:'var(--ex-belly)' }
];
const EX_MAP = {};
EXERCISES.forEach(e => EX_MAP[e.id] = e);

// ============ PRESET SEED (历史打卡数据: 帕梅拉/瘦腿/安娜) ============
(function seedHabitPreset() {
  try {
    // 帕梅拉5分钟瘦腹: 7/16-7/31 (7/24 休息未打卡, 8/1 未完成不写)
    const pamelaDays = ['2026-07-16','2026-07-17','2026-07-18','2026-07-19','2026-07-20','2026-07-21','2026-07-22','2026-07-23','2026-07-25','2026-07-26','2026-07-27','2026-07-28','2026-07-29','2026-07-30','2026-07-31'];
    // 7/28 起加练: 瘦腿(leg) + 安娜(anna)
    const legAnnaDays = ['2026-07-28','2026-07-29','2026-07-30','2026-07-31'];

    const today = todayStr();
    const log = STORE.get('habit_log', null);
    const presetLog = {};
    pamelaDays.forEach(ds => { (presetLog[ds] = presetLog[ds] || []).push('pamela'); });
    legAnnaDays.forEach(ds => { const arr = presetLog[ds] = presetLog[ds] || []; arr.push('leg','anna'); });

    if (log === null) {
      STORE.set('habit_log', presetLog);
    } else {
      // 已有数据: 只为缺失的历史日期补写, 不覆盖已有记录
      let changed = false;
      Object.keys(presetLog).forEach(ds => {
        if (ds < today && !log[ds]) { log[ds] = presetLog[ds]; changed = true; }
      });
      if (changed) STORE.set('habit_log', log);
    }

    // 安娜: 普通自定义打卡项
    const habits = STORE.get('habits', null);
    if (habits === null) {
      STORE.set('habits', [
        { id: 'h1', name: '喝8杯水', icon: '💧' },
        { id: 'h2', name: '阅读30分钟', icon: '📖' },
        { id: 'h3', name: '早睡(23点前)', icon: '😴' },
        { id: 'h4', name: '护肤', icon: '✨' },
        { id: 'anna', name: '安娜', icon: '🧘' }
      ]);
    } else if (!habits.some(h => h.id === 'anna' || h.name === '安娜')) {
      habits.push({ id: 'anna', name: '安娜', icon: '🧘' });
      STORE.set('habits', habits);
    }
  } catch(e) {}
})();

// ============ DATA MIGRATION (旧打卡数据 → 新结构) ============
(function migrate() {
  try {
    if (localStorage.getItem('gd_habit_log') !== null) return;
    const log = {};
    const oldDone = STORE.get('habit_done', {});
    if (Object.keys(oldDone).length > 0) {
      log[todayStr()] = Object.keys(oldDone).filter(id => oldDone[id]);
    }
    STORE.set('habit_log', log);
  } catch(e) {}
})();

// ============ HELPERS ============
const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => [...(p || document).querySelectorAll(s)];
function fmtDate(d) { const m=d.getMonth()+1, day=d.getDate(); return `${m}月${day}日`; }
function fmtMoney(n) { return n.toFixed(2); }
function todayStr() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function toast(msg) { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============ STATE ============
let currentTab = 'overview';
let fitMonth = new Date().getMonth();
let fitYear = new Date().getFullYear();
let weightChart = null;

// ============ HEADER ============
function updateHeader() {
  const now = new Date();
  $('#headerDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${['日','一','二','三','四','五','六'][now.getDay()]}`;
  const h = now.getHours();
  const emojis = h<6?'🌙':h<9?'☀️':h<12?'🌸':h<14?'🍃':h<18?'🌤️':h<21?'🌆':'🌙';
  $('#headerEmoji').textContent = emojis;
}

// ============ TAB SWITCHING ============
function switchTab(tab) {
  currentTab = tab;
  $$('button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderModule(tab);
  const fab = $('#fabBtn');
  fab.style.display = ['overview','habits','fitness'].includes(tab) ? 'none' : 'flex';
}

// ============ RENDER ROUTER ============
function renderModule(tab) {
  const main = $('#mainContent');
  switch(tab) {
    case 'overview': renderOverview(main); break;
    case 'money': renderMoney(main); break;
    case 'weight': renderWeight(main); break;
    case 'habits': renderHabits(main); break;
    case 'fitness': renderFitness(main); break;
    case 'todos': renderTodos(main); break;
  }
}

// ============ MONEY MODULE ============
function renderMoney(main) {
  const records = STORE.get('money', []);
  const now = new Date();
  const thisMonth = records.filter(r => {
    const d = new Date(r.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const income = thisMonth.filter(r => r.type === 'income').reduce((s,r) => s + r.amount, 0);
  const expense = thisMonth.filter(r => r.type === 'expense').reduce((s,r) => s + r.amount, 0);

function toggleHabit(id) {

    log[today] = arr;

  if (log[today].length === 0) delete log[today];
  STORE.set('habit_log', log);
  renderModule('habits');
}

function deleteHabit(id) {

    log[d] = log[d].filter(x => x !== id);

  });
  STORE.set('habit_log', log);
  renderModule('habits');

// 连续坚持天数：从今天（或昨天）往前连续计数
function calcStreak(id) {
  const log = STORE.get('habit_log', {});
  let streak = 0;
  const d = new Date();
  if (!(log[dateStr(d)]||[]).includes(id)) d.setDate(d.getDate()-1);
  while (true) {
    const arr = log[dateStr(d)] || [];
    if (arr.includes(id)) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

// 某月完成次数
function monthCount(id, year, month) {
  const log = STORE.get('habit_log', {});
  let c = 0;
  Object.keys(log).forEach(ds => {
    const [y,m] = ds.split('-').map(Number);
    if (y === year && m === month+1 && log[ds].includes(id)) c++;
  });
  return c;
}

// ============ FITNESS CALENDAR MODULE ============
function renderFitness(main) {
  const log = STORE.get('habit_log', {});
  const year = fitYear, month = fitMonth;
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const today = new Date();

  let html = '<div class="card">';
  html += '<div class="cal-header">';
  html += `<button onclick="fitChangeMonth(-1)">◀</button>`;
  html += `<span class="month-label">🏊 ${year}年 ${monthNames[month]}</span>`;
  html += `<button onclick="fitChangeMonth(1)">▶</button>`;
  html += '</div>';

  html += '<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(d => html += `<div class="day-name">${d}</div>`);

  for (let i = firstDay - 1; i >= 0; i--) {
    const d = prevMonthDays - i;
    html += `<div class="day other">${d}</div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===d;
    const dayEx = (log[ds] || []).filter(id => EX_MAP[id]);
    let cls = 'day';
    if (isToday) cls += ' today';
    let dots = '';
    if (dayEx.length > 0) {
      const shown = dayEx.slice(0, 4);
      dots = `<div class="cal-dots">${shown.map(id => `<span class="cal-dot" style="background:${EX_MAP[id].color};"></span>`).join('')}${dayEx.length>4?`<span class="cal-dot plus"></span>`:''}</div>`;
    }
    html += `<div class="${cls}" onclick="fitDayClick('${ds}')">${d}${dots}</div>`;
  }

  const remaining = 42 - firstDay - daysInMonth;
  for (let d = 1; d <= Math.min(remaining, 14); d++) {
    html += `<div class="day other">${d}</div>`;
  }
  html += '</div>';

  // Legend + 本月统计
  html += '<div class="fitness-legend">';
  EXERCISES.forEach(e => {
    html += `<span><span class="ex-dot" style="background:${e.color};"></span>${e.name} ${monthCount(e.id, year, month)}次</span>`;
  });
  html += '</div>';
  html += '</div>';

  main.innerHTML = html;
}

function fitChangeMonth(delta) {
  fitMonth += delta;
  if (fitMonth > 11) { fitMonth = 0; fitYear++; }
  if (fitMonth < 0) { fitMonth = 11; fitYear--; }
  renderModule('fitness');
}

// 点击日历某天 → 弹出该天运动打卡
function fitDayClick(ds) {
  const log = STORE.get('habit_log', {});
  const dayEx = log[ds] || [];
  showModal(`🏊 ${ds} 运动打卡`, `
    ${EXERCISES.map(e => {
      const on = dayEx.includes(e.id);
      return `
      <div class="habit-row" style="cursor:pointer;" onclick="fitToggle('${ds}','${e.id}')">
        <span class="ex-dot" style="background:${e.color};"></span>
        <span class="habit-name" style="${on?'text-decoration:line-through;color:var(--text-light);':''}">${e.icon} ${e.name}</span>
        <span class="habit-check ${on?'done':''}" style="width:22px;height:22px;font-size:12px;">${on?'✓':''}</span>
      </div>`;
    }).join('')}
  `);
}

function fitToggle(ds, exId) {
  const log = STORE.get('habit_log', {});
  const arr = log[ds] || [];
  if (arr.includes(exId)) log[ds] = arr.filter(x => x !== exId);
  else { arr.push(exId); log[ds] = arr; }
  if (log[ds].length === 0) delete log[ds];
  STORE.set('habit_log', log);
  fitDayClick(ds); // 刷新弹窗
}

    </div>

    <div class="card">
      <div class="card-header">
        <h3>📝 今日待办</h3>
        <button class="btn btn-sm btn-outline" onclick="switchTab('todos')">管理</button>
      </div>
      ${activeTodos.length === 0 ? '<div class="empty">今日无待办，轻松~ 🎉</div>' : activeTodos.slice(0,5).map(t => `
        <div class="list-item">
          <div class="todo-check" onclick="toggleTodoFromOv('${t.id}')"></div>
          <span class="todo-text" style="flex:1;">${esc(t.text)}</span>
        </div>
      `).join('')}
      ${activeTodos.length > 5 ? `<div style="text-align:center;font-size:12px;color:var(--text-light);padding-top:8px;">还有 ${activeTodos.length-5} 项，点「管理」查看全部</div>` : ''}
    </div>
  `;

  if (recent.length >= 2) {
    setTimeout(() => {
      const ctx = $('#ovWeightChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: recent.map(r => r.date.slice(5)),
          datasets: [{
            data: recent.map(r => r.weight),
            borderColor: '#B08985',
            backgroundColor: 'rgba(201,169,166,0.08)',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
            borderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            x: { display: false, grid: { display: false } },
            y: { display: false, grid: { display: false } }
          }
        }
      });
    }, 100);
  }
}

function monthExpense() {
  const records = STORE.get('money', []);
  const now = new Date();
  return records.filter(r => {
    if (r.type !== 'expense') return false;
    const d = new Date(r.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).reduce((s,r) => s + r.amount, 0);
}

function toggleTodoFromOv(id) {
  toggleTodo(id);
  renderModule('overview');
}

// ============ TODOS MODULE ============
function renderTodos(main) {
  const todos = STORE.get('todos', []);
  const active = todos.filter(t => !t.done);
  const completed = todos.filter(t => t.done);

  main.innerHTML = `
    <div class="summary-row">
      <div class="summary-card">
        <div class="label">待完成</div>
        <div class="value" style="color:var(--danger)">${active.length}</div>
      </div>
      <div class="summary-card">
        <div class="label">已完成</div>
        <div class="value" style="color:var(--success)">${completed.length}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>📌 待办事项</h3>
        <button class="btn btn-sm btn-outline" onclick="openTodoModal()">+ 添加</button>
      </div>
      ${active.length === 0 ? '<div class="empty">暂无待办，轻松~ 🎉</div>' : active.map(t => `
        <div class="list-item">
          <div class="todo-check" onclick="toggleTodo('${t.id}')"></div>
          <span class="todo-text" style="flex:1;">${esc(t.text)}</span>
          <button class="btn-danger" onclick="deleteTodo('${t.id}')">✕</button>
        </div>
      `).join('')}
    </div>
    ${completed.length > 0 ? `
    <div class="card">
      <div class="card-header"><h3>✅ 已完成 (${completed.length})</h3></div>
      ${completed.map(t => `
        <div class="list-item">
          <div class="todo-check done" onclick="toggleTodo('${t.id}')">✓</div>
          <span class="todo-text done-text" style="flex:1;">${esc(t.text)}</span>
          <button class="btn-danger" onclick="deleteTodo('${t.id}')">✕</button>
        </div>
      `).join('')}
    </div>
    ` : ''}
  `;
}

function openTodoModal() {
  showModal('📝 添加待办', `
    <div class="form-row"><input type="text" id="todoText" placeholder="待办内容"></div>
    <button class="btn btn-primary" id="todoSave">添加</button>
  `);
  $('#todoSave').onclick = () => {
    const text = $('#todoText').value.trim();
    if (!text) { toast('请输入待办内容'); return; }
    const todos = STORE.get('todos', []);
    todos.push({ id: genId(), text, done: false, date: todayStr() });
    STORE.set('todos', todos);
    closeModal();
    renderModule('todos');
  };
}

function toggleTodo(id) {
  const todos = STORE.get('todos', []);
  const t = todos.find(x => x.id === id);
  if (t) t.done = !t.done;
  STORE.set('todos', todos);
  renderModule('todos');
}

function deleteTodo(id) {
  const todos = STORE.get('todos', []);
  STORE.set('todos', todos.filter(t => t.id !== id));
  renderModule('todos');
}

// ============ MODAL ============
function showModal(title, bodyHtml) {
  $('#modalSheet').innerHTML = `<h3>${title}</h3>${bodyHtml}<button class="btn" style="background:#F0EBE7;width:100%;justify-content:center;margin-top:8px;" onclick="closeModal()">取消</button>`;
  $('#modalOverlay').classList.add('show');
}
function closeModal() {
  $('#modalOverlay').classList.remove('show');
}
$('#modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============ FAB ============
$('#fabBtn').addEventListener('click', () => {
  switch(currentTab) {
    case 'money': openMoneyModal('expense'); break;
    case 'weight': openWeightModal(); break;
    case 'todos': openTodoModal(); break;
  }
});

// ============ TAB NAV ============
$$('button[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ============ INIT ============
updateHeader();
switchTab('overview');
setInterval(updateHeader, 60000);

// ============ Register SW ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
